# One-time recovery for the explicitly requested repository rename.
# The ordinary Pages workflow remains manual-only. Remove this workflow after verifying the recovery.
name: One-time Pages rename recovery

on:
  workflow_run:
    workflows: ['Validate website']
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: one-time-pages-rename-recovery
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == 'YoungJibbit95/ldt-skill' &&
          github.event.workflow_run.head_commit.message == 'fix(pages): restore ldt-skill base path' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      FIXED_SHA: ${{ github.event.workflow_run.head_sha }}
      VALIDATION_RUN: ${{ github.event.workflow_run.id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Find the single validated candidate artifact for the exact revision
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.request
          repository = 'YoungJibbit95/ldt-skill'
          run_id = int(os.environ['VALIDATION_RUN'])
          source_sha = os.environ['FIXED_SHA']
          req = urllib.request.Request(
              f'https://api.github.com/repos/{repository}/actions/runs/{run_id}/artifacts?per_page=100',
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                       'Accept': 'application/vnd.github+json',
                       'X-GitHub-Api-Version': '2022-11-28'})
          with urllib.request.urlopen(req, timeout=30) as response:
              data = json.load(response)
          matches = [a for a in data.get('artifacts', [])
                     if a.get('name') == 'website-candidate' and a.get('expired') is False
                     and a.get('workflow_run', {}).get('id') == run_id
                     and a.get('workflow_run', {}).get('head_sha') == source_sha]
          if len(matches) != 1:
              raise SystemExit('Expected exactly one successful candidate artifact for this source')
          open('artifact-id.txt', 'w', encoding='utf-8').write(str(matches[0]['id']))
          PY
      - name: Download candidate and independently verify GitHub provenance
        shell: bash
        run: |
          python website/scripts/candidate-metadata.py \
            --run "$VALIDATION_RUN" --artifact "$(cat artifact-id.txt)" \
            --sha "$FIXED_SHA" --output downloaded
      - name: Verify exact archive, file inventory, provenance and release identity
        shell: bash
        run: |
          archive_hash="$(python -c 'import json; print(json.load(open("downloaded/manifest.json"))["archive_sha256"])')"
          python website/scripts/release.py verify \
            --archive downloaded/site.tar.gz --manifest downloaded/manifest.json \
            --trusted downloaded/trusted.json --sha "$FIXED_SHA" \
            --archive-hash "$archive_hash" --extract verified-site
          echo "Verified SHA-256: $archive_hash"
      - name: Package previously validated bytes for Pages without rebuilding
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: verified-site
          retention-days: 90

  deploy:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish verified Pages candidate
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  public-evidence:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      FIXED_SHA: ${{ github.event.workflow_run.head_sha }}
      ASTRO_TELEMETRY_DISABLED: '1'
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: website/.nvmrc
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check public routes, content, localization and accessibility
        run: npm run check:published -- --public --sha "$FIXED_SHA" --output reports/public-urls
      - name: Measure public mobile performance
        run: npm run measure -- --public --origin https://youngjibbit95.github.io --sha "$FIXED_SHA" --output reports/public-performance
      - name: Retain public check evidence, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rename-recovery-public-evidence
          path: website/reports
          retention-days: 90
          if-no-files-found: ignore
