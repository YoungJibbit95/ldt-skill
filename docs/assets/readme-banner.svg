  <g fill="none" stroke="#bfa4ef" stroke-opacity=".08"><path d="M840 0v320M920 0v320M1000 0v320M1080 0v320M1160 0v320M1240 0v320M800 80h480M800 160h480M800 240h480"/></g>
  <text x="64" y="65" fill="#bea6ef" font-family="ui-monospace,Consolas,monospace" font-size="13" letter-spacing="3">ARCHITECTURE FIRST</text>
  <text x="60" y="151" fill="#f6f2ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="64" font-weight="650" letter-spacing="-2">LittleDevTeam</text>
  <text x="64" y="199" fill="#c7bfd9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22">Build in steps. Review the result.</text>
  <path d="M64 243h45" stroke="#ac86ee" stroke-width="3"/>
  <text x="125" y="248" fill="#a99cbf" font-family="ui-monospace,Consolas,monospace" font-size="13">architect-dev-team</text>
