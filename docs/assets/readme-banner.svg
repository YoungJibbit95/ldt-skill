<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">LittleDevTeam</title>
  <desc id="desc">Dunkler Nebula-Hintergrund mit violettem Orbitzeichen. Architecture first. Build in steps.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1024"/><stop offset="1" stop-color="#140e26"/></linearGradient>
    <radialGradient id="nebula"><stop stop-color="#8055d9" stop-opacity=".32"/><stop offset="1" stop-color="#8055d9" stop-opacity="0"/></radialGradient>
    <radialGradient id="red"><stop stop-color="#d44579" stop-opacity=".2"/><stop offset="1" stop-color="#d44579" stop-opacity="0"/></radialGradient>
    <linearGradient id="orbit"><stop stop-color="#b79aff"/><stop offset="1" stop-color="#f39ac6"/></linearGradient>
  </defs>
  <rect width="1280" height="320" rx="22" fill="url(#bg)"/>
  <ellipse cx="980" cy="115" rx="350" ry="230" fill="url(#nebula)"/>
  <ellipse cx="1190" cy="300" rx="320" ry="240" fill="url(#red)"/>
